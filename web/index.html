<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>GCC Publyq</title>
  <meta name="description" content="Voice-first workplace assistant for GCC Ward 173 field staff and leadership." />
  <meta name="theme-color" content="#070d10" />
  <link rel="icon" href="assets/favicon-32.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" />
  <link rel="stylesheet" href="styles/tokens.css" />
  <link rel="stylesheet" href="styles/app.css" />
</head>
<body>
  <a class="skip-link" href="#text">Skip to input</a>
  <header class="top">
    <button class="brand" data-act="new" aria-label="New conversation">
      <img src="assets/logo.png" alt="" width="28" height="28" />
      <span><strong>GCC Publyq</strong><span class="sub">Ward 173 · Adyar</span></span>
    </button>
    <div class="top-actions">
      <button class="role-pill" id="rolePill" data-act="roles" aria-haspopup="dialog" hidden></button>
      <button class="icon-btn" data-act="history" aria-label="Conversation history" title="History">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5M12 7v5l3 2"/></svg>
      </button>
      <button class="icon-btn" data-act="new" aria-label="New conversation" title="New conversation">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
  </header>

  <main id="main">
    <section class="feed" id="feed" aria-live="polite" aria-label="Conversation"></section>
  </main>

  <footer class="dock">
    <div class="queued" id="queued" hidden></div>
    <form class="composer" id="composer" autocomplete="off">
      <button type="button" class="mic" id="mic" aria-label="Tap to speak" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3zM5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      </button>
      <input id="text" name="text" placeholder="Speak or type…" aria-label="Message" maxlength="1000" enterkeyhint="send" />
      <button type="submit" class="send" aria-label="Send">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </form>
    <div class="hint">
      <label class="switch"><input type="checkbox" id="handsfree" /> <span>Hands-free</span></label>
      <label class="switch"><input type="checkbox" id="speak" checked /> <span>Speak replies</span></label>
      <span id="status" class="status" aria-live="polite">connecting…</span>
    </div>
  </footer>

  <div class="sheet" id="historySheet" role="dialog" aria-modal="true" aria-labelledby="historyTitle" hidden>
    <div class="sheet-panel">
      <div class="sheet-h"><h2 id="historyTitle">Conversations</h2><button class="icon-btn" data-act="close" aria-label="Close">✕</button></div>
      <p class="note">Saved on the server for this device. Deleting hides a conversation; actions it created stay in the action ledger.</p>
      <ul class="history" id="historyList"></ul>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
